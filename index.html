<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>カネノナルキ - NISA握力養成所</title>
    <style>
        :root {
            --primary: #2ecc71;
            --accent: #4285F4;
            --money: #f39c12;
            --bg: #f0f4f8;
            --danger: #e74c3c;
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg);
            margin: 0;
            color: #333;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding-bottom: 75px;
        }

        .app-container {
            background: white;
            padding: 1.5rem;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            text-align: center;
            width: 100%;
            max-width: 480px;
            margin: 10px;
            position: relative;
            align-self: flex-start;
        }

        .user-profile-nav {
            position: absolute;
            top: 15px;
            right: 15px;
            cursor: pointer;
            z-index: 100;
        }

        .user-icon {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            border: 2px solid white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .badge {
            background: #eef4ff;
            color: var(--accent);
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.7rem;
            display: inline-block;
            margin-bottom: 5px;
        }

        #tree-display {
            font-size: 80px;
            margin: 10px 0;
        }

        @keyframes tree-bounce {
            0%   { transform: scale(1); }
            30%  { transform: scale(1.3) translateY(-20px); }
            50%  { transform: scale(0.9); }
            70%  { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .bounce-animation {
            animation: tree-bounce 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .main-stats {
            display: flex;
            justify-content: space-around;
            margin-bottom: 1rem;
            background: #fdfdfd;
            padding: 15px;
            border-radius: 15px;
            border: 1px solid #f0f0f0;
        }

        .stat-item p  { margin: 0; font-size: 0.7rem; color: #999; }
        .stat-item div { font-size: 1.1rem; font-weight: bold; color: var(--primary); }

        .market-status {
            margin-bottom: 1.5rem;
            padding: 12px;
            border-radius: 12px;
            background: #fff5f5;
            border: 1px solid #ffe3e3;
            display: none;
        }

        .market-status.active { display: block; }
        .loss-title  { font-size: 0.75rem; color: var(--danger); font-weight: bold; margin-bottom: 4px; }
        .loss-detail { font-size: 1.2rem; color: var(--danger); font-weight: 900; }

        .hold-button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 16px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            width: 100%;
            transition: 0.2s;
            margin-bottom: 1rem;
            box-shadow: 0 4px 12px rgba(46, 204, 113, 0.2);
        }

        .hold-button:disabled { background-color: #ccc; cursor: not-allowed; box-shadow: none; }

        #toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: #333;
            color: white;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 0.85rem;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s, transform 0.3s;
            z-index: 9999;
        }

        #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        #chat-messages {
            height: calc(100vh - 320px);
            overflow-y: auto;
            padding-bottom: 100px;
        }

        .msg-unit {
            background: white;
            border: 1px solid #eee;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 12px;
            text-align: left;
        }

        .msg-header { display: flex; justify-content: space-between; align-items: flex-start; }
        .user-name  { font-weight: bold; font-size: 0.85rem; }
        .msg-text   { font-size: 0.9rem; line-height: 1.5; margin: 8px 0; white-space: pre-wrap; }

        .msg-actions { display: flex; gap: 12px; font-size: 0.75rem; color: #666; margin-top: 10px; }
        .action-btn {
            cursor: pointer; display: flex; align-items: center; gap: 4px; padding: 4px 8px;
            border-radius: 6px; background: #f8f9fa;
        }
        .action-icon { width: 14px; height: 14px; fill: currentColor; }

        .input-area {
            position: fixed; bottom: 65px; left: 0; width: 100%;
            background: white; padding: 10px 15px; box-sizing: border-box;
            border-top: 1px solid #eee; z-index: 900;
        }
        .input-row { display: flex; gap: 8px; }
        #chat-input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 8px; outline: none; }
        #chat-send-btn { background: var(--accent); color: white; border: none; padding: 0 15px; border-radius: 8px; cursor: pointer; }

        .bottom-nav {
            display: flex; justify-content: space-around; align-items: center; height: 65px;
            background: #ffffff; border-top: 1px solid #eee; position: fixed;
            bottom: 0; left: 0; width: 100%; z-index: 1000;
            padding-bottom: env(safe-area-inset-bottom);
        }
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; color: #888; cursor: pointer; }
        .nav-item.active { color: var(--primary); }
        .nav-label { font-size: 10px; font-weight: bold; }
        .nav-icon-svg { width: 20px; height: 20px; fill: currentColor; margin-bottom: 2px; }

        #settings-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); z-index: 2000; display: none;
        }
        .modal-content {
            position: absolute; bottom: 0; background: white; width: 100%;
            padding: 1.5rem; border-radius: 20px 20px 0 0; box-sizing: border-box;
        }
        .input-group { margin: 10px 0; text-align: left; }
        .input-group label { display: block; font-size: 0.75rem; color: #666; }
        .input-group input { width: 100%; padding: 10px; border: 1px solid #eee; border-radius: 10px; box-sizing: border-box; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="toast"></div>

<div class="app-container">
    <div id="user-nav" class="user-profile-nav hidden" onclick="showSettings()">
        <img id="my-icon" class="user-icon" src="" alt="user">
    </div>

    <div id="login-section">
        <h1 style="margin-bottom:0.5rem;">🌳 カネノナルキ</h1>
        <p style="color: #666; font-size: 0.85rem;">〜NISA握力養成所〜</p>
        <button class="hold-button" id="btn-login" style="background-color: var(--accent);">Googleで修行を開始</button>
    </div>

    <div id="main-content" class="hidden">
        <div id="user-badge" class="badge">🐣 ひよっこ門下生</div>
        <div id="tree-display">🌱</div>

        <div class="main-stats">
            <div class="stat-item"><p>修行日数</p><div id="day-count">0日</div></div>
            <div class="stat-item"><p>累計守護額</p><div id="saved-amount">¥0</div></div>
        </div>

        <div id="market-status-area" class="market-status">
            <div class="loss-title">⚠️ 今日の暴風雨（評価損）</div>
            <div id="today-loss-display" class="loss-detail">-¥0</div>
        </div>

        <button class="hold-button" id="hold-btn">今日も売らなかった！</button>
        <p style="font-size: 0.7rem; color: #999;">※売却ボタンはありません。消すまで修行です。</p>
    </div>

    <div id="chat-content" class="hidden">
        <h3 style="margin: 0 0 10px 0; font-size: 1rem;">道場</h3>
        <div id="chat-messages"></div>
        <div class="input-area">
            <div class="input-row">
                <input type="text" id="chat-input" placeholder="今の心境を綴れ..." maxlength="200">
                <button id="chat-send-btn">送信</button>
            </div>
            <label style="font-size: 0.65rem; color: #888; margin-top: 5px; display: block; text-align: left;">
                <input type="checkbox" id="mask-amount-check"> 守護額を隠す
            </label>
        </div>
    </div>
</div>

<nav class="bottom-nav hidden" id="global-nav">
    <div class="nav-item active" id="nav-main" onclick="switchTab('main')">
        <svg class="nav-icon-svg"><use href="#icon-home"></use></svg>
        <span class="nav-label">修行</span>
    </div>
    <div class="nav-item" id="nav-chat" onclick="switchTab('chat')">
        <svg class="nav-icon-svg"><use href="#icon-chat"></use></svg>
        <span class="nav-label">道場</span>
    </div>
</nav>

<div id="settings-modal" onclick="hideSettings()">
    <div class="modal-content" onclick="event.stopPropagation()">
        <h3 style="margin-top:0;">🧘 修行プラン</h3>
        <div class="input-group">
            <label>オルカン 現在評価額(円)</label>
            <input type="number" id="setting-ac-current" min="0">
        </div>
        <div class="input-group">
            <label>オルカン 毎月の積立額(円)</label>
            <input type="number" id="setting-ac-monthly" min="0">
        </div>
        <div class="input-group">
            <label>S&P500 現在評価額(円)</label>
            <input type="number" id="setting-sp-current" min="0">
        </div>
        <div class="input-group">
            <label>S&P500 毎月の積立額(円)</label>
            <input type="number" id="setting-sp-monthly" min="0">
        </div>
        <button onclick="saveSettings()" style="width:100%; padding:15px; border-radius:30px; border:none; background:var(--primary); color:white; font-weight:bold; cursor:pointer;">保存</button>
        <button onclick="confirmLogout()" style="width:100%; padding:10px; border:none; background:none; color:var(--danger); margin-top:10px; cursor:pointer;">ログアウト</button>
    </div>
</div>

<svg style="display: none;">
    <symbol id="icon-home" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></symbol>
    <symbol id="icon-chat" viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></symbol>
    <symbol id="icon-like" viewBox="0 0 24 24"><path d="M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z"/></symbol>
</svg>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getDatabase, ref, get, set, update, onValue, push, serverTimestamp, query, limitToLast } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey:        "AIzaSyALG070NijPZ0U5RdfMXF_4dIJrEoFELqY",
        authDomain:    "nisa-kane-no-naru-ki.firebaseapp.com",
        databaseURL:   "https://nisa-kane-no-naru-ki-default-rtdb.firebaseio.com",
        projectId:     "nisa-kane-no-naru-ki",
        appId:         "1:466336366620:web:7fd41d4742cfbc56fc5fd9"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    let currentUser = null;
    let userData = null;
    let marketRates = { 'all-country': 1.0, 'sp500': 1.0 };

    // --- ユーティリティ ---
    function showToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg; t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2500);
    }

    function escapeHtml(str) {
        if (!str) return "";
        return str.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
    }

    function getBadgeInfo(days) {
        const d = Number(days) || 0;
        if (d >= 100) return { name: "伝説", emoji: "🏆" };
        if (d >= 50)  return { name: "金剛不壊", emoji: "🦾" };
        if (d >= 30)  return { name: "熟練", emoji: "🥋" };
        if (d >= 7)   return { name: "一人前", emoji: "⚔️" };
        return { name: "ひよっこ", emoji: "🐣" };
    }

    function getTodayJST() {
        const d = new Date();
        const jst = new Date(d.getTime() + 9 * 60 * 60 * 1000);
        return jst.toISOString().split('T')[0];
    }

    // --- タブ切り替え ---
    window.switchTab = (tab) => {
        document.getElementById('main-content').classList.toggle('hidden', tab !== 'main');
        document.getElementById('chat-content').classList.toggle('hidden', tab !== 'chat');
        document.getElementById('nav-main').classList.toggle('active', tab === 'main');
        document.getElementById('nav-chat').classList.toggle('active', tab === 'chat');
    };

    // --- 認証 & データ同期 ---
    onAuthStateChanged(auth, user => {
        if (user) {
            currentUser = user;
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('global-nav').classList.remove('hidden');
            document.getElementById('user-nav').classList.remove('hidden');
            document.getElementById('my-icon').src = user.photoURL || '';

            // 相場監視
            onValue(ref(db, 'market/rates'), snap => {
                if (snap.exists()) marketRates = snap.val();
                if (userData) updateUI();
            });

            // ユーザーデータ監視
            onValue(ref(db, `users/${user.uid}`), snap => {
                userData = snap.val() || { days: 0, totalResistedLoss: 0 };
                updateUI();
            });

            initChat();
            switchTab('main');
        } else {
            currentUser = null;
            document.getElementById('login-section').classList.remove('hidden');
        }
    });

    // --- UI更新 ---
    function updateUI() {
        if (!userData) return;
        const days = Number(userData.days) || 0;
        const b = getBadgeInfo(days);
        const loss = calculateTodayLoss();

        document.getElementById('day-count').innerText = `${days}日`;
        document.getElementById('user-badge').innerText = `${b.emoji} ${b.name}門下生`;
        document.getElementById('saved-amount').innerText = `¥${(userData.totalResistedLoss || 0).toLocaleString()}`;

        const statusArea = document.getElementById('market-status-area');
        if (loss > 0) {
            document.getElementById('today-loss-display').innerText = `-¥${loss.toLocaleString()}`;
            statusArea.classList.add('active');
        } else {
            statusArea.classList.remove('active');
        }

        const treeIcons = ["🌱", "🌿", "🌲", "🌳", "💹"];
        document.getElementById('tree-display').innerText = treeIcons[Math.min(Math.floor(days / 10), 4)];
        document.getElementById('hold-btn').disabled = (userData.lastPressed === getTodayJST());
    }

    function calculateTodayLoss() {
        if (!userData) return 0;
        const acBase = (Number(userData.ac_current) || 0) + ((Number(userData.ac_monthly) || 0) / 30 * (userData.days || 0));
        const acLoss = marketRates['all-country'] < 1 ? acBase * (1 - marketRates['all-country']) : 0;
        const spBase = (Number(userData.sp_current) || 0) + ((Number(userData.sp_monthly) || 0) / 30 * (userData.days || 0));
        const spLoss = marketRates['sp500'] < 1 ? spBase * (1 - marketRates['sp500']) : 0;
        return Math.floor(acLoss + spLoss);
    }

    // --- アクション ---
    document.getElementById('hold-btn').onclick = async () => {
        const loss = calculateTodayLoss();
        await update(ref(db, `users/${currentUser.uid}`), {
            days: (userData.days || 0) + 1,
            totalResistedLoss: (userData.totalResistedLoss || 0) + loss,
            lastPressed: getTodayJST()
        });
        const tree = document.getElementById('tree-display');
        tree.classList.add('bounce-animation');
        setTimeout(() => tree.classList.remove('bounce-animation'), 600);
        showToast('🌱 握力が1上がった！');
    };

    // --- チャットロジック ---
    let chatLoaded = false;
    function initChat() {
        if (chatLoaded) return;
        chatLoaded = true;
        onValue(query(ref(db, 'messages/room_0'), limitToLast(30)), snap => {
            const container = document.getElementById('chat-messages');
            container.innerHTML = "";
            const list = [];
            snap.forEach(child => { list.push({ id: child.key, ...child.val() }); });
            list.reverse().forEach(m => renderMsg(m, container));
        });
    }

    function renderMsg(m, container) {
        try {
            const div = document.createElement('div');
            div.className = 'msg-unit';
            const d = Number(m.days) || 0;
            const b = getBadgeInfo(d);
            const likesCount = m.likes ? Object.keys(m.likes).length : 0;

            div.innerHTML = `
                <div class="msg-header">
                    <div>
                        <span class="user-name">${escapeHtml(m.name)}</span>
                        <span style="font-size:0.6rem; color:var(--accent);"> ${b.emoji}${d}日目</span>
                    </div>
                    <div style="font-size:0.7rem; color:#999;">
                        ${m.isAmountHidden ? '¥****' : `守護額: ¥${(Number(m.amount) || 0).toLocaleString()}`}
                    </div>
                </div>
                <div class="msg-text">${escapeHtml(m.text)}</div>
            `;

            const actions = document.createElement('div');
            actions.className = 'msg-actions';
            const likeBtn = document.createElement('div');
            likeBtn.className = 'action-btn';
            likeBtn.innerHTML = `<svg class="action-icon"><use href="#icon-like"></use></svg> <span>${likesCount}</span>`;
            likeBtn.onclick = () => handleReaction(m.id);
            
            actions.appendChild(likeBtn);
            div.appendChild(actions);
            container.appendChild(div);
        } catch (e) { console.error("Msg Render Error", e); }
    }

    window.handleReaction = async (msgId) => {
        const rRef = ref(db, `messages/room_0/${msgId}/likes/${currentUser.uid}`);
        const snap = await get(rRef);
        await set(rRef, snap.exists() ? null : true);
    };

    document.getElementById('chat-send-btn').onclick = async () => {
        const input = document.getElementById('chat-input');
        const text = input.value.trim();
        if (!text) return;
        await push(ref(db, 'messages/room_0'), {
            name: currentUser.displayName,
            text: text,
            days: userData.days || 0,
            amount: userData.totalResistedLoss || 0,
            isAmountHidden: document.getElementById('mask-amount-check').checked,
            timestamp: serverTimestamp()
        });
        input.value = "";
    };

    // --- 設定 ---
    window.showSettings = () => {
        document.getElementById('setting-ac-current').value = userData.ac_current || 0;
        document.getElementById('setting-ac-monthly').value = userData.ac_monthly || 0;
        document.getElementById('setting-sp-current').value = userData.sp_current || 0;
        document.getElementById('setting-sp-monthly').value = userData.sp_monthly || 0;
        document.getElementById('settings-modal').style.display = 'block';
    };
    window.hideSettings = () => document.getElementById('settings-modal').style.display = 'none';
    window.saveSettings = async () => {
        await update(ref(db, `users/${currentUser.uid}`), {
            ac_current: parseInt(document.getElementById('setting-ac-current').value) || 0,
            ac_monthly: parseInt(document.getElementById('setting-ac-monthly').value) || 0,
            sp_current: parseInt(document.getElementById('setting-sp-current').value) || 0,
            sp_monthly: parseInt(document.getElementById('setting-sp-monthly').value) || 0,
        });
        hideSettings();
        showToast('✅ 設定を更新しました');
    };
    window.confirmLogout = () => { if(confirm('ログアウトしますか？')) auth.signOut().then(() => location.reload()); };
    window.btn_login = () => signInWithPopup(auth, provider);
    document.getElementById('btn-login').onclick = window.btn_login;

</script>
</body>
</html>
